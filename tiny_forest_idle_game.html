<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#143b2d">
<title>ちいさな森を育てよう</title>
<style>
:root{--green:#143b2d;--leaf:#2d7650;--cream:#fff8e8;--gold:#f3c969;--ink:#20342a}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#dff1d6,#f8f1d8 55%,#f7e5b9);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:var(--ink);min-height:100vh}
button{font:inherit;touch-action:manipulation;cursor:pointer}
.app{max-width:560px;margin:0 auto;padding:14px 14px 30px}
header{background:var(--green);color:white;border-radius:20px;padding:16px;box-shadow:0 5px 0 #0b291e}
header h1{font-size:22px;margin:0 0 5px}
header p{font-size:12px;margin:0;opacity:.85}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:13px 0}
.stat{background:#fffdf4;border:2px solid #d7e5c8;border-radius:14px;padding:10px}
.stat small{display:block;color:#58715d;font-size:12px}
.stat strong{font-size:21px;display:block;margin-top:2px}
.forest{position:relative;overflow:hidden;background:linear-gradient(#9ed8ed 0 42%,#d5edb5 42% 100%);border:3px solid #fffdf4;border-radius:22px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:12px;box-shadow:0 5px 0 #d0d9b7}
.sun{position:absolute;right:22px;top:18px;width:45px;height:45px;border-radius:50%;background:#ffe58a;box-shadow:0 0 0 9px #ffe58a44}
.cloud{position:absolute;top:40px;left:20px;font-size:35px;opacity:.75}
.tree{position:relative;z-index:1;font-size:100px;line-height:1.15;filter:drop-shadow(0 5px 2px #50763b33);transition:transform .2s}
.tree.pop{transform:scale(1.12)}
.tree-name{z-index:1;font-weight:800;background:#fffdf0d9;padding:5px 14px;border-radius:999px;margin-top:2px}
.tap{width:100%;margin-top:12px;background:var(--gold);border:0;border-radius:15px;padding:15px;font-size:18px;font-weight:900;color:#493817;box-shadow:0 4px 0 #c69b3b}
.tap:active,.buy:active{transform:translateY(2px);box-shadow:none}
.section-title{font-size:17px;font-weight:900;margin:20px 2px 9px}
.upgrades{display:grid;gap:9px}
.upgrade{display:flex;align-items:center;gap:10px;background:#fffdf4;border:2px solid #d9e4c9;border-radius:15px;padding:11px}
.up-icon{font-size:30px;width:40px;text-align:center}
.up-info{flex:1;min-width:0}
.up-info strong{display:block;font-size:14px}
.up-info small{display:block;color:#637467;font-size:12px;margin-top:3px}
.buy{background:var(--leaf);color:white;border:0;border-radius:11px;padding:10px 11px;font-weight:800;min-width:88px}
.buy:disabled{background:#b9c4b8;color:#f8fff5;cursor:default}
.progress-wrap{background:#fffdf4;border-radius:14px;padding:12px;border:2px solid #d9e4c9;margin-top:10px}
.progress-label{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:7px}
.track{height:12px;background:#e2e8d8;border-radius:99px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,#64b96d,#e9cb55);border-radius:99px;transition:width .25s}
.footer{font-size:11px;line-height:1.6;color:#657466;margin-top:18px;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#183d2e;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;z-index:5}
.toast.show{opacity:1}
.reset{display:block;margin:14px auto 0;background:transparent;border:1px solid #9eae97;color:#657466;border-radius:9px;padding:7px 12px;font-size:12px}
@media(min-width:500px){.app{padding-top:24px}.forest{min-height:280px}.tree{font-size:118px}}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>🌱 ちいさな森を育てよう</h1>
  <p>タップして木を育てよう。道具をそろえると、森が自動でコインを集めます。</p>
</header>
<div class="stats">
  <div class="stat"><small>🪙 コイン</small><strong id="coins">0</strong></div>
  <div class="stat"><small>🍃 1秒ごとの収入</small><strong id="rate">0</strong></div>
</div>
<section class="forest" aria-label="育成エリア">
  <div class="sun"></div><div class="cloud">☁️</div>
  <div class="tree" id="tree">🌱</div>
  <div class="tree-name" id="treeName">芽が出た！</div>
</section>
<button class="tap" id="tapButton">🌿 森をお世話する！ <span id="tapValue">+1</span></button>
<div class="progress-wrap">
  <div class="progress-label"><span>次の成長まで</span><span id="progressText">0 / 10</span></div>
  <div class="track"><div class="bar" id="progressBar"></div></div>
</div>
<div class="section-title">🧺 森のお手伝いアイテム</div>
<div class="upgrades" id="upgrades"></div>
<div class="footer">このゲーム内のコインはゲーム専用で、現金や商品には交換できません。<br>進行状況はこのブラウザに保存されます。</div>
<button class="reset" id="resetButton">最初からやり直す</button>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
const SAVE_KEY='tiny_forest_idle_v1';
const items=[
 {id:'sprout',icon:'🪴',name:'小さな植木鉢',desc:'タップの力 +1',base:15,power:1,kind:'tap'},
 {id:'bee',icon:'🐝',name:'働き者のミツバチ',desc:'毎秒 +1 コイン',base:25,power:1,kind:'auto'},
 {id:'watering',icon:'🚿',name:'自動水やり機',desc:'毎秒 +5 コイン',base:100,power:5,kind:'auto'},
 {id:'gardener',icon:'🧑‍🌾',name:'森の庭師',desc:'毎秒 +18 コイン',base:350,power:18,kind:'auto'},
 {id:'pond',icon:'🪷',name:'きれいな池',desc:'毎秒 +60 コイン',base:1200,power:60,kind:'auto'}
];
let state={coins:0,taps:0,tapPower:1,owned:{},lastTime:Date.now()};
let toastTimer=null;
const $=id=>document.getElementById(id);
const fmt=n=>Math.floor(n).toLocaleString('ja-JP');
function cost(item){return Math.floor(item.base*Math.pow(1.55,state.owned[item.id]||0))}
function rate(){return items.filter(x=>x.kind==='auto').reduce((s,x)=>s+x.power*(state.owned[x.id]||0),0)}
function treeStage(){let n=state.taps; if(n>=150)return 4;if(n>=70)return 3;if(n>=25)return 2;if(n>=8)return 1;return 0}
const stages=[
 {emoji:'🌱',name:'芽が出た！'},
 {emoji:'🌿',name:'小さな苗木'},
 {emoji:'🌳',name:'元気な若木'},
 {emoji:'🌲',name:'立派な木'},
 {emoji:'🌳🌼',name:'花いっぱいの森'}
];
function say(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1700)}
function save(){state.lastTime=Date.now();try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){}}
function load(){try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const old=JSON.parse(raw);if(old&&typeof old.coins==='number'){state={...state,...old};const elapsed=Math.min(8*60*60,Math.max(0,(Date.now()-(old.lastTime||Date.now()))/1000));const earned=rate()*elapsed;state.coins+=earned;if(earned>=1)setTimeout(()=>say('おかえり！留守の間に '+fmt(earned)+' コイン集まったよ'),350)}}}catch(e){}}
function renderUpgrades(){
 const wrap=$('upgrades');wrap.innerHTML='';
 items.forEach(item=>{
  const count=state.owned[item.id]||0,price=cost(item);
  const card=document.createElement('div');card.className='upgrade';
  const icon=document.createElement('div');icon.className='up-icon';icon.textContent=item.icon;
  const info=document.createElement('div');info.className='up-info';
  const title=document.createElement('strong');title.textContent=item.name+' × '+count;
  const desc=document.createElement('small');desc.textContent=item.desc+' · 次の価格 '+fmt(price);
  info.append(title,desc);
  const btn=document.createElement('button');btn.className='buy';btn.textContent='購入';btn.disabled=state.coins<price;
  btn.addEventListener('click',()=>buy(item.id));
  card.append(icon,info,btn);wrap.append(card);
 });
}
function render(){
 $('coins').textContent=fmt(state.coins);$('rate').textContent=fmt(rate());
 $('tapValue').textContent='+'+fmt(state.tapPower);
 const stage=stages[treeStage()];$('tree').textContent=stage.emoji;$('treeName').textContent=stage.name;
 const goal=[8,25,70,150,150][treeStage()];const previous=[0,8,25,70,150][treeStage()];
 const progress=Math.min(100,((state.taps-previous)/Math.max(1,goal-previous))*100);
 $('progressText').textContent=fmt(state.taps)+' 回';$('progressBar').style.width=progress+'%';
 renderUpgrades();
}
function buy(id){const item=items.find(x=>x.id===id);if(!item)return;const price=cost(item);if(state.coins<price){say('コインが足りないよ');return}state.coins-=price;state.owned[id]=(state.owned[id]||0)+1;if(item.kind==='tap')state.tapPower+=item.power;save();render();say(item.name+'を手に入れた！')}
$('tapButton').addEventListener('click',()=>{state.coins+=state.tapPower;state.taps++;const tree=$('tree');tree.classList.add('pop');setTimeout(()=>tree.classList.remove('pop'),130);render();save()});
$('resetButton').addEventListener('click',()=>{if(confirm('コインや育成状況を消して最初からやり直しますか？')){localStorage.removeItem(SAVE_KEY);state={coins:0,taps:0,tapPower:1,owned:{},lastTime:Date.now()};render();say('新しい森を始めよう！')}});
load();render();
setInterval(()=>{state.coins+=rate();render();},1000);
setInterval(save,5000);
window.addEventListener('pagehide',save);
})();
</script>
</body>
</html>
